<!-- etv html file for S3 bucket -->

<!-- html skeleton creates dashboard page structure  -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCP Gas Sensor Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ambient animated background, ported from a 21st.dev canvas component — see wave-bg.js -->
  <canvas id="wave-bg"></canvas>

  <div id="app">
    <div class="nav-bar">
      <img class="brand-logo" src="frellmann-logo.png" alt="Frellmann Water Technologies">
      <div class="nav-links">
        <span class="nav-current-label">Dashboard</span>
        <a class="nav-btn" href="gas_sensor_history.html">History</a>
        <a class="nav-btn" href="gas_sensor_records.html">Records</a>
      </div>
    </div>
    <div id="header"></div>
    <div id="timestamp"></div>
    <div id="sensors"></div>
    <div id="spread"></div>
    <div id="footer"></div>
  </div>

<!-- css for dashboard styling -->

  <style>
    /* ─── design tokens · all theming lives here ─── */
    :root {
      /* backgrounds — deep navy */
      --bg:         #071624;
      --panel:      #0c2233;
      --panel-2:    #103048;
      --border:     #1c4257;
      --grid:       #16354a;
      /* text */
      --text:       #d6e7f2;
      --text-dim:   #86a3ba;
      --text-muted: #4f6f88;
      /* teal accent — the HUD wiring */
      --accent:      #22e3d4;
      --accent-dim:  #159c93;
      --accent-soft: rgba(34, 227, 212, 0.12);
      --accent-line: rgba(34, 227, 212, 0.35);
      --accent-glow: rgba(34, 227, 212, 0.22);
      /* status tiers — semantic, kept as-is */
      --ok:    #34d0b0;
      --warn:  var(--warn);
      --alert: var(--alert);
      --crit:  var(--crit);
      /* type */
      --font-display: 'Young Serif', serif;
      --font-body:    'Instrument Sans', sans-serif;
    }

    /* ─── reset & base ─── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      font-variant-numeric: tabular-nums;
    }

    #app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    /* ─── ambient wave background (wave-bg.js) ─── */
    #wave-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── header ─── */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #ffffff;
    }

    .header-device {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .ago-text {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-muted);
    }

    .refresh-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 0;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .refresh-btn:hover {
      color: var(--accent);
    }

    /* ─── stat pills row ─── */
    .stats-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .stat-pill {
      background: transparent;
      border: none;
      padding: 10px 16px;
      min-width: 120px;
      flex: 1 1 120px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
    }

    /* ─── timestamp ─── */
    #timestamp {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* ─── sensor card grid ─── */
    #sensors {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .sensor-card {
      background: transparent;
      border: 1px solid rgba(28, 66, 87, 0.35);
      border-radius: 10px;
      padding: 16px 20px;

      /* ─── expandable cards ─── */
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .sensor-card:hover {
      border-color: var(--accent-glow);
    }

    .expand-icon {
      display: inline-block;
      font-size: 11px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
      margin-left: 8px;
    }

    .sensor-card.expanded .expand-icon {
      transform: rotate(90deg);
    }

    .expanded-details {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(28, 66, 87, 0.4);
    }

    .sensor-card.expanded .expanded-details {
      display: block;
    }

    .threshold-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-body);
      font-size: 11px;
    }

    .threshold-table th {
      text-align: left;
      color: var(--text-muted);
      font-weight: 500;
      padding: 6px 8px;
      border-bottom: 1px solid var(--grid);
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.06em;
    }

    .threshold-table td {
      padding: 6px 8px;
      color: var(--text-dim);
    }

    .threshold-table .current-value {
      font-weight: 600;
    }

    .em-contribution {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--grid);
    }

    .em-contribution span {
      color: var(--text-dim);
    }

    .diag-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .diag-cell {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 8px 10px;
    }
    .diag-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .diag-value {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .diag-note {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .diag-gases {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--grid);
    }
    .diag-gas-chip {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
    }

    .sensor-card.elevated {
      border-color: rgba(232, 119, 46, 0.45);
    }

    .sensor-name {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .sensor-card.elevated .sensor-name {
      color: var(--alert);
    }

    .sensor-count {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .sensor-voltage {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 10px;
      font-family: var(--font-body);
    }
    .voltage-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .voltage-value { font-size: 12px; font-weight: 600; }

    /* ─── individual reading row ─── */
    .reading {
      padding: 10px 0;
      border-bottom: 1px solid var(--grid);
    }

    .reading:last-child {
      border-bottom: none;
    }

    .reading-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .gas-name {
      font-size: 13px;
      font-weight: 500;
    }

    .reading-values {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .gas-value {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .gas-unit {
      font-size: 10px;
      color: var(--text-muted);
      min-width: 30px;
    }

    .gas-trend {
      font-size: 14px;
      min-width: 14px;
      text-align: center;
    }

    /* ─── threshold bar ─── */
    .bar-track {
      position: relative;
      height: 5px;
      background: var(--grid);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: 3px;
      transition: width 0.8s ease, background 0.4s ease;
      min-width: 2px;
    }

    /* ─── tier badge ─── */
    .tier-row {
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tier-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 1px 6px;
      border-radius: 3px;
    }

    .trend-label {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* ─── nav bar ─── */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;      /* add this */
      row-gap: 10px;         /* add this — spacing when it wraps to 2 lines */
      gap: 18px;
      margin-bottom: 16px;
    }

    /* logo's own background was removed at the pixel level (see frellmann-logo.png) —
       nothing but the white wordmark renders, so it sits directly on the wave */
    .brand-logo {
      height: 60px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 0;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-current-label {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .nav-btn:hover {
      color: var(--accent);
    }

    /* ─── cross-sensor spread ─── */
    #spread {
      background: transparent;
      border: none;
      padding: 16px 0 0;
      margin-top: 20px;
    }

    .spread-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    .spread-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 0;
      border-bottom: 1px solid var(--grid);
    }

    .spread-row:last-child {
      border-bottom: none;
    }

    .spread-gas {
      font-weight: 600;
      font-size: 13px;
      min-width: 70px;
    }

    .spread-bar {
      flex: 1 1 160px;
      height: 14px;
      background: var(--grid);
      border-radius: 7px;
      position: relative;
      min-width: 120px;
      overflow: hidden;
    }

    .spread-stats {
      display: flex;
      gap: 16px;
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-muted);
    }

    .spread-stats span span {
      color: var(--text-dim);
    }

    /* ─── footer ─── */
    #footer {
      margin-top: 24px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      font-family: var(--font-body);
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ─── tier colors (used by JS) ─── */
    .tier-normal  { color: var(--accent); }
    .tier-alert   { color: var(--warn); }
    .tier-caution { color: var(--alert); }
    .tier-warning { color: var(--crit); }
    .tier-unknown { color: var(--text-muted); }
      </style>

<!-- javascript fetches data from API, transforms it into HTML -->
<!-- dashboard set to resfresh every 15 seconds -->

  <script>
    // ─── CONFIG ───
    // colors, thresholds, and units to match lambda
    const API = "https://ulyjh5b6h2.execute-api.us-east-2.amazonaws.com/readings";
    const POLL_MS = 15000;

    // tier colors — match the CSS
    const TIER_COLORS = {
      normal: "var(--ok)", alert: "var(--warn)", caution: "var(--alert)",
      warning: "var(--crit)", unknown: "var(--text-dim)",
    };

    // tier background tints for badges
    const TIER_BG = {
      normal: "rgba(52,208,88,.08)", alert: "rgba(240,180,41,.08)",
      caution: "rgba(232,119,46,.08)", warning: "rgba(234,74,90,.08)",
      unknown: "rgba(106,127,150,.06)",
    };

    // warning-level thresholds — bar fills to 100% at warning level
    // mirrors your Lambda thresholds dict
    const WARN = {
      LPG: 2000, H2: 10000, CH4: 25000, Alcohol: 3300, Benzene: 1,
      Hexane: 1100, Smoke: 15, CO: 200, Flammable: 25, Ozone: 5,
      CO2: 30000, NH4: 300, Toluene: 500, Acetone: 2500,
    };

    // full threshold tiers + PEL for expanded detail view
    const THRESHOLDS = {
      LPG:       { alert: 500,   caution: 1000,  warning: 2000,  pel: 1000 },
      H2:        { alert: 4000,  caution: 8000,  warning: 10000, pel: 8000 },
      CH4:       { alert: 5000,  caution: 12500, warning: 25000, pel: 5000 },
      Alcohol:   { alert: 500,   caution: 1000,  warning: 3300,  pel: 1000 },
      Benzene:   { alert: 0.1,   caution: 0.5,   warning: 1,     pel: 1 },
      Hexane:    { alert: 50,    caution: 500,   warning: 1100,  pel: 500 },
      Smoke:     { alert: 1,     caution: 5,     warning: 15,    pel: 5 },
      CO:        { alert: 35,    caution: 50,    warning: 200,   pel: 50 },
      Flammable: { alert: 5,     caution: 10,    warning: 25,    pel: 10 },
      Ozone:     { alert: 0.1,   caution: 0.3,   warning: 5,     pel: 0.1 },
      CO2:       { alert: 5000,  caution: 15000, warning: 30000, pel: 5000 },
      NH4:       { alert: 25,    caution: 50,    warning: 300,   pel: 50 },
      Toluene:   { alert: 100,   caution: 200,   warning: 500,   pel: 200 },
      Acetone:   { alert: 250,   caution: 750,   warning: 2500,  pel: 1000 },
    };

    // units per gas — everything else defaults to ppm
    const UNITS = { Smoke: "mg/m³"};

    // sensor → index in raw.adc — matches the FIRMWARE fill order, not MQ number:
    // adc[0]=MQ131, adc[1]=MQ135, adc[2]=MQ2 ... adc[8]=MQ9
    const ADC_INDEX = {
      MQ131: 0, MQ135: 1, MQ2: 2, MQ3: 3, MQ4: 4,
      MQ5: 5, MQ6: 6, MQ7: 7, MQ9: 8,
    };
    const ADC_MAX = 4095;    // 12-bit ADC full scale
    const ADC_VREF = 3.3;    // GIGA ADC reference voltage

    // convert a sensor's raw ADC count to volts; null if the row has no raw data
    function sensorVoltage(name, raw) {
      if (!raw || !raw.adc) return null;
      var idx = ADC_INDEX[name];
      if (idx == null) return null;
      var count = raw.adc[idx];
      if (count == null) return null;
      return (count / ADC_MAX) * ADC_VREF;
    }

    // voltage health color — gauges distance from the 3.3V clipping ceiling
    function voltageColor(v) {
      if (v >= 3.0) return TIER_COLORS.warning;   // near ceiling — clipping risk
      if (v >= 2.5) return TIER_COLORS.caution;   // climbing, keep an eye on it
      return "var(--accent)";                           // healthy
    }

    // ─── HELPERS ───

    // format numbers to reasonable precision
    function fmt(v) {
      if (v == null) return "—";
      if (Math.abs(v) >= 10000) return v.toFixed(0);
      if (Math.abs(v) >= 100) return v.toFixed(1);
      if (Math.abs(v) >= 1) return v.toFixed(2);
      return v.toFixed(3);
    }

    // get the display unit for a gas
    function gasUnit(gas) {
      return UNITS[gas] || "ppm";
    }

    // graph colors per gas — keep in sync with the history page's GAS_COLORS
    var GAS_COLORS = {
      LPG: "#ff1212", H2: "#ff6912", CH4: "#ffbc12", Alcohol: "#ffef12",
      Benzene: "#b8ff12", Hexane: "#5dff12", Smoke: "#12ff9c", CO: "#12ffe7",
      Flammable: "#02e7f7", Ozone: "#022ff7", CO2: "#ffd400", NH4: "#da02f7",
      Toluene: "#f7029d", Acetone: "#ffbde8",
    };
    function gasColor(gas) { return GAS_COLORS[gas] || "var(--text)"; }

    // calculate how full the threshold bar should be (0 to 1)
    function barPct(gas, value) {
      var w = WARN[gas];
      return w ? Math.min(value / w, 1) : 0;
    }

    // tier a CO2 ppm value against the same cutoffs as the Lambda's thresholds
    function classifyCO2(v) {
      var t = THRESHOLDS.CO2;
      if (v >= t.warning) return "warning";
      if (v >= t.caution) return "caution";
      if (v >= t.alert)   return "alert";
      return "normal";
    }

    // trend arrow character
    function trendChar(t) {
      if (t === "rising") return "↑";
      if (t === "falling") return "↓";
      if (t === "stable") return "→";
      return "·";
    }

    // trend arrow color
    function trendColor(t) {
      if (t === "rising") return TIER_COLORS.warning;
      if (t === "falling") return TIER_COLORS.normal;
      return "var(--text-muted)";
    }

    // OSHA Em color — green under 0.5, amber under 1.0, red above
    function emColor(em) {
      if (em < 0.5) return TIER_COLORS.normal;
      if (em < 1.0) return TIER_COLORS.alert;
      return TIER_COLORS.warning;
    }

    // group flat readings array by sensor name, sorted by sensor number
    function groupBySensor(readings) {
      var groups = {};
      readings.forEach(function(r) {
        if (!groups[r.sensor]) groups[r.sensor] = [];
        groups[r.sensor].push(r);
      });
      // sort readings within each sensor by value (highest first)
      Object.keys(groups).forEach(function(key) {
        groups[key].sort(function(a, b) { return b.value - a.value; });
      });
      // sort sensor names by their number (MQ2 before MQ7 before MQ135)
      var sortedKeys = Object.keys(groups).sort(function(a, b) {
        return parseInt(a.replace(/\D/g, "")) - parseInt(b.replace(/\D/g, ""));
      });
      var sorted = {};
      sortedKeys.forEach(function(k) { sorted[k] = groups[k]; });
      return sorted;
    }

    // ─── RENDER FUNCTIONS ───

    function renderHeader(data, ago) {
      var em = data.osha_mixture_em || 0;
      var ml = data.ml || {};
      var anomaly = ml.anomaly_detected;
      var recon = ml.reconstruction_error;

      return '<div class="header-top">'
        + '  <div>'
        + '    <div class="header-title">PCP Gas Sensor Monitor</div>'
        + '    <div class="header-device">' + data.device_id + '</div>'
        + '  </div>'
        + '  <div class="header-status">'
        + '    <div class="live-dot"></div>'
        + '    <span class="ago-text">' + ago + 's ago</span>'
        + '    <button class="refresh-btn" onclick="fetchData()">⟳ refresh</button>'
        + '  </div>'
        + '</div>'
        + '<div class="stats-row">'
        + '  <div class="stat-pill">'
        + '    <div class="stat-label">OSHA Mixture (Em)</div>'
        + '    <div class="stat-value" style="color:' + emColor(em) + '">' + fmt(em) + '</div>'
        + '  </div>'
        + '  <div class="stat-pill">'
        + '    <div class="stat-label">ML Recon. Error</div>'
        + '    <div class="stat-value">' + (recon != null ? fmt(recon) : "—") + '</div>'
        + '  </div>'
        + '  <div class="stat-pill">'
        + '    <div class="stat-label">Anomaly</div>'
        + '    <div class="stat-value" style="color:' + (anomaly ? TIER_COLORS.warning : TIER_COLORS.normal) + '">'
        +        (anomaly ? "DETECTED" : "None") + '</div>'
        + '  </div>'
        + '  <div class="stat-pill">'
        + '    <div class="stat-label">Refresh</div>'
        + '    <div class="stat-value">' + (POLL_MS / 1000) + 's</div>'
        + '  </div>'
        + '</div>';
    }

    function renderReading(r) {
      var pct = barPct(r.gas, r.value);
      var tc = TIER_COLORS[r.tier] || TIER_COLORS.unknown;
      var bg = TIER_BG[r.tier] || TIER_BG.unknown;

      return '<div class="reading">'
        + '  <div class="reading-top">'
        + '    <span class="gas-name" style="color:' + gasColor(r.gas) + '">' + r.gas + '</span>'
        + '    <div class="reading-values">'
        + '      <span class="gas-value">' + fmt(r.value) + '</span>'
        + '      <span class="gas-unit">' + gasUnit(r.gas) + '</span>'
        + '      <span class="gas-trend" style="color:' + trendColor(r.trend) + '">'
        +          trendChar(r.trend) + '</span>'
        + '    </div>'
        + '  </div>'
        + '  <div class="bar-track">'
        + '    <div class="bar-fill" style="width:' + (pct * 100) + '%;background:' + tc + '"></div>'
        + '  </div>'
        + '  <div class="tier-row">'
        + '    <span class="tier-badge" style="color:' + tc + ';background:' + bg + '">' + r.tier + '</span>'
        + (r.trend ? '    <span class="trend-label">' + r.trend + '</span>' : '')
        + '  </div>'
        + '</div>';
    }

    // small labeled metric cell for the diagnostic panel
    function diagCell(label, value) {
      return '<div class="diag-cell">'
        + '<div class="diag-label">' + label + '</div>'
        + '<div class="diag-value">' + value + '</div>'
        + '</div>';
    }

    // per-sensor diagnostic: raw ADC, baseline, output voltage, Rs/R0 ratio
    function renderExpandedDetails(name, readings, raw) {
      var idx = ADC_INDEX[name];
      var hasRaw = raw && raw.adc && idx != null && raw.adc[idx] != null;

      var html = '<div class="expanded-details">';

      if (hasRaw) {
        var adcVal  = raw.adc[idx];
        var baseVal = (raw.baseline && raw.baseline[idx] != null) ? raw.baseline[idx] : null;
        var vout  = (adcVal / ADC_MAX) * ADC_VREF;
        var vout0 = baseVal != null ? (baseVal / ADC_MAX) * ADC_VREF : null;

        // Rs/R0 — RL cancels out: [(Vcc-Vout)/Vout] / [(Vcc-Vout0)/Vout0], Vcc = 5V
        var rsr0 = null;
        if (vout0 != null && vout > 0 && vout0 > 0) {
          rsr0 = ((5.0 - vout) / vout) / ((5.0 - vout0) / vout0);
        }

        html += '<div class="diag-grid">'
          + diagCell("Raw ADC", adcVal.toFixed(0))
          + diagCell("Baseline ADC", baseVal != null ? baseVal.toFixed(0) : "—")
          + diagCell("Output", vout.toFixed(3) + " V")
          + diagCell("Rs/R0", rsr0 != null ? rsr0.toFixed(3) : "—")
          + '</div>'
          + '<div class="diag-note">Rs/R0 sits near 1.0 in clean air and drops as the sensor '
          + 'responds to gas. Baseline ADC is the clean-air reference captured at boot.</div>';
      } else {
        html += '<div class="diag-note">No raw sensor data in this reading yet. Diagnostics '
          + 'appear once the board logs a reading containing raw ADC values.</div>';
      }

      // gases this sensor monitors, in their graph colors
      html += '<div class="diag-gases">';
      readings.forEach(function(r) {
        html += '<span class="diag-gas-chip" style="color:' + gasColor(r.gas) + '">' + r.gas + '</span>';
      });
      html += '</div></div>';
      return html;
    }

    // standalone CO2 card — sourced from the top-level co2_ndir (S88 NDIR sensor),
    // NOT from the readings list. -1 means no valid reading that cycle.
    function renderCO2Card(co2) {
      var hasReading = (co2 != null && co2 !== -1);      // -1 or missing = no reading
      var value = hasReading ? fmt(co2) : "\u2014";      // em dash when no reading
      var tier  = hasReading ? classifyCO2(co2) : "unknown";
      var tc    = TIER_COLORS[tier] || TIER_COLORS.unknown;
      var bg    = TIER_BG[tier] || TIER_BG.unknown;
      var pct   = hasReading ? barPct("CO2", co2) : 0;   // reuse CO2 warn threshold for the bar

      return '<div class="sensor-card' + (tier === "caution" || tier === "warning" ? ' elevated' : '') + '">'
        + '<div class="sensor-name" style="color:' + gasColor("CO2") + '">CO\u2082 (NDIR)</div>'
        + '<div class="sensor-count">Senseair S88 · dedicated sensor</div>'
        + '<div class="reading">'
        + '  <div class="reading-top">'
        + '    <span class="gas-name" style="color:' + gasColor("CO2") + '">CO\u2082</span>'
        + '    <div class="reading-values">'
        + '      <span class="gas-value">' + value + '</span>'
        + '      <span class="gas-unit">ppm</span>'
        + '    </div>'
        + '  </div>'
        + '  <div class="bar-track">'
        + '    <div class="bar-fill" style="width:' + (pct * 100) + '%;background:' + tc + '"></div>'
        + '  </div>'
        + '  <div class="tier-row">'
        + '    <span class="tier-badge" style="color:' + tc + ';background:' + bg + '">' + tier + '</span>'
        + '  </div>'
        + '</div>'
        + '</div>';
    }

    function renderSensorCard(name, readings, raw) {
      var hasElevated = readings.some(function(r) {
        return r.tier === "caution" || r.tier === "warning";
      });

      var html = '<div class="sensor-card' + (hasElevated ? ' elevated' : '') + '">'
        + '<div class="sensor-name">' + name
        + '  <span class="expand-icon">▸</span></div>'
        + '<div class="sensor-count">' + readings.length + ' gas'
        + (readings.length !== 1 ? 'es' : '') + ' monitored</div>';

      var volts = sensorVoltage(name, raw);
      if (volts != null) {
        html += '<div class="sensor-voltage">'
          + '<span class="voltage-label">Sensor output</span>'
          + '<span class="voltage-value" style="color:' + voltageColor(volts) + '">'
          +    volts.toFixed(3) + ' V</span>'
          + '</div>';
      }

      readings.forEach(function(r) {
        if (r.gas === "CO2_est") return;   // hide MQ135's rough CO2 estimate; real CO2 shown in its own card
        html += renderReading(r);
      });

      // expanded threshold detail (hidden until clicked)
      html += renderExpandedDetails(name, readings, raw);

      html += '</div>';
      return html;
    }

    function renderSpread(spread) {
      if (!spread || Object.keys(spread).length === 0) return '';

      var html = '<div class="spread-title">Cross-Sensor Spread</div>';

      Object.keys(spread).forEach(function(gas) {
        var s = spread[gas];
        // calculate positions for the visual range bar
        var maxRef = s.max * 1.2;  // add 20% padding to the right
        var minPos = (s.min / maxRef) * 100;
        var maxPos = (s.max / maxRef) * 100;
        var meanPos = (s.mean / maxRef) * 100;
        var rangeWidth = Math.max(maxPos - minPos, 2);

        html += '<div class="spread-row">'
          + '  <span class="spread-gas" style="color:' + gasColor(gas) + '">' + gas + '</span>'
          + '  <div class="spread-bar">'
          // highlighted range band
          + '    <div style="position:absolute;left:' + minPos + '%;width:' + rangeWidth
          +        '%;height:100%;background:rgba(88,166,255,.2);border-radius:7px"></div>'
          // min marker
          + '    <div style="position:absolute;left:' + minPos
          +        '%;top:0;width:3px;height:100%;background:var(--accent);border-radius:2px"></div>'
          // max marker
          + '    <div style="position:absolute;left:' + maxPos
          +        '%;top:0;width:3px;height:100%;background:var(--accent);border-radius:2px"></div>'
          // mean dot
          + '    <div style="position:absolute;left:' + meanPos
          +        '%;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%'
          +        ';background:var(--text);border:2px solid var(--grid)"></div>'
          + '  </div>'
          + '  <div class="spread-stats">'
          + '    <span>min <span>' + fmt(s.min) + '</span></span>'
          + '    <span>max <span>' + fmt(s.max) + '</span></span>'
          + '    <span>Δ <span style="color:var(--accent)">' + fmt(s.range) + '</span></span>'
          + '    <span>μ <span>' + fmt(s.mean) + '</span></span>'
          + '    <span>n=' + s.sensor_count + '</span>'
          + '  </div>'
          + '</div>';
      });

      return html;
    }

    // ─── STATE & DATA FETCHING ───

    var currentData = null;
    var lastFetchTime = null;
    var agoSeconds = 0;

    function fetchData() {
      fetch(API + "?limit=10")
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function(json) {
          currentData = json;
          lastFetchTime = Date.now();
          renderDashboard();
        })
        .catch(function(err) {
          document.getElementById("header").innerHTML =
            '<div class="header-title" style="color:var(--crit)">Connection Error: ' + err.message + '</div>';
        });
    }

    function renderDashboard() {
      if (!currentData || currentData.length === 0) {
        document.getElementById("header").innerHTML =
          '<div class="header-title">No sensor data yet</div>';
        return;
      }

      var latest = currentData[0];
      var sensors = groupBySensor(latest.readings);
      var timestamp = latest.server_time || new Date(latest.timestamp_ms).toISOString();

      // header
      document.getElementById("header").innerHTML = renderHeader(latest, agoSeconds);

      // timestamp
      document.getElementById("timestamp").innerHTML = "Latest reading: " + timestamp;

      // sensor cards — CO2 card first so it sits top-left, easy to monitor
      var cardsHtml = renderCO2Card(latest.co2_ndir);
      var raw = latest.raw;
      Object.keys(sensors).forEach(function(name) {
        cardsHtml += renderSensorCard(name, sensors[name], raw);
      });
      document.getElementById("sensors").innerHTML = cardsHtml;

      // cross-sensor spread
      document.getElementById("spread").innerHTML = renderSpread(latest.cross_sensor_spread);

      // footer
      document.getElementById("footer").innerHTML =
        '<span>ETV Frellmann · Gas Sensor Monitoring System</span>'
        + '<span>Auto-refresh: ' + (POLL_MS / 1000) + 's · Region: us-east-2</span>';
    }

    // ─── START ───

    // initial fetch
    fetchData();

    // auto-refresh every 15 seconds
    setInterval(fetchData, POLL_MS);

    // update the "seconds ago" counter every second
    setInterval(function() {
      if (lastFetchTime) {
        agoSeconds = Math.floor((Date.now() - lastFetchTime) / 1000);
        // only update the ago text, not the whole page
        var agoEl = document.querySelector(".ago-text");
        if (agoEl) agoEl.textContent = agoSeconds + "s ago";
      }
    }, 1000);

    // click to expand/collapse sensor cards
    document.getElementById("sensors").addEventListener("click", function(e) {
      var card = e.target.closest(".sensor-card");
      if (card) {
        card.classList.toggle("expanded");
      }
    });

  </script>

  <script src="wave-bg.js"></script>

</body>
</html>
